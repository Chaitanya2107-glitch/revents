[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "college-events-backend"
version = "1.0.0"
description = "College event registration, ticketing, and attendance API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic>=2.11,<3", "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "qrcode[pil]>=8,<9",
  "Pillow>=11.2,<13", "reportlab>=4.3,<5", "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
